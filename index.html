<!DOCTYPE html> 
<html> 
<head> 
    <title>Nerwin Monopoly</title> 
 
    <style> 
        * { 
            box-sizing: border-box; 
        } 
 
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden;
            background-color: #1E3A5F; 
        } 
.board { 
    width: 125vmin; 
    height: 95vmin; 
    margin: auto; 
    display: grid; 
    grid-template-columns: repeat(7, 1fr); 
    grid-template-rows: repeat(7, 1fr); 
 
    column-gap: 15px; /* horizontal distance */ 
    row-gap: 8px;     /* vertical distance */ 
 
    transform: translate(-5px, 20px); 
} 
.square { 
    border: 2px solid black; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    font-size: 4vmin; /* bigger number */ 
    font-weight: bold; 
    background-color: lightblue; 
} 

#dice {
    display: flex;
    gap: 20px;
    font-size: 130px;
    align-items: center;
    justify-content: center;
}

.dice {
    display: inline-block;
    transition: transform 0.3s;
}

.dice.rolling {
    animation: diceSpin 0.6s linear;
}

@keyframes diceSpin {
    0% {
        transform: rotate(0deg);
    }

    25% {
        transform: rotate(90deg);
    }

    50% {
        transform: rotate(180deg);
    }

    75% {
        transform: rotate(270deg);
    }

    100% {
        transform: rotate(360deg);
    }
}

.left-box {
    position: absolute;
    left: 10px;
    top: 100px;
    width: 220px;
    height: 260px;
    background-color: lightblue;
    border: 2px solid black;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

.left-box button {
    font-size: 20px;
    padding: 5px 15px;
}
.group-box {
    position: absolute;
    left: 10px;
    top: 380px;
    width: 100px;
    height: 100px;
    background-color: hotpink;
    border: 2px solid black;

    align-items: center;

.group-box div {

    font-weight: bold;
}

.group-box button {
    font-size: 14px;
    padding: 2px 10px;
}
.square {
    position: relative;
}

.pawn {
    position: absolute;
    color: hotpink;
    font-size: 60px;
    z-index: 10;
    pointer-events: none;
-webkit-text-stroke: 1px black;
}

.group-box-2 button {

/* ==================== VOUCHER WHEEL ==================== */

.voucher-wheel-container {

    top: 50%;

    flex-direction: column;
    align-items: center;
    gap: 25px;

.voucher-wheel {

    height: 500px;

        #ff6666 0deg 45deg,
        #66ccff 45deg 90deg,
        #66ff99 90deg 135deg,
        #ffcc66 135deg 180deg,
        #cc99ff 180deg 225deg,
        #ff9999 225deg 270deg,
        #99ffcc 270deg 315deg,

.vt1 { transform: rotate(-67.5deg) translate(100px, -15px); }

.vt6 { transform: rotate(157.5deg) translate(100px, -15px); }

<script>

// ==================== DICE ====================

function rollDice() {

    const diceFaces = [
        "⚀",
        "⚁",
        "⚂",
        "⚃",
        "⚄",
        "⚅"
    ];

    const dice1 = document.getElementById("dice1");
    const dice2 = document.getElementById("dice2");

    // Dice 1 can only show 1-4
    const random1 = Math.floor(Math.random() * 4);

    // Dice 2 can show 1-6
    const random2 = Math.floor(Math.random() * 6);

    // Restart animation
    dice1.classList.remove("rolling");
    dice2.classList.remove("rolling");

    // Force browser to restart animation
    void dice1.offsetWidth;
    void dice2.offsetWidth;

    dice1.classList.add("rolling");
    dice2.classList.add("rolling");

    // Show results after spinning
    setTimeout(function() {

        dice1.textContent = diceFaces[random1];
        dice2.textContent = diceFaces[random2];

    }, 600);
}


// ==================== BORDER THICKNESS ====================

document.querySelectorAll(".square").forEach(square => {
    const number = parseInt(square.textContent);
    square.style.borderWidth = (number * 0.2) + "px";
});


// ==================== FINISH ORDER ====================

let finishOrder = [];

function getSuffix(number) {
    if (number === 1) {
        return "st";
    } else if (number === 2) {
        return "nd";
    } else if (number === 3) {
        return "rd";
    } else {
        return "th";
    }
}

function updateFinishBox() {

    const winnerBox = document.getElementById("winner");

    // If nobody has finished, show nothing
    if (finishOrder.length === 0) {
        winnerBox.innerHTML = "";
        return;
    }

    // Show the current finishing order
    winnerBox.innerHTML = "";

    finishOrder.forEach((player, index) => {

        const place = index + 1;
        const line = document.createElement("div");

        line.textContent =
            place + getSuffix(place) + " " + player;

        winnerBox.appendChild(line);
    });
}


// Add a player to the finish list
function checkWinner(position, color) {

    // Only add the player when they reach 49
    if (position === 49) {

        // Don't add the same player twice
        if (!finishOrder.includes(color)) {

            finishOrder.push(color);

            updateFinishBox();
        }
    }
}


// Remove a player from the finish list
function removeFromFinish(color) {

    const index = finishOrder.indexOf(color);

    if (index !== -1) {

        finishOrder.splice(index, 1);

        // Re-number everyone after removing the player
        updateFinishBox();
    }
}


// ==================== GROUP 1 ====================

let group1Position = 1;

function updatePawn() {

    document.querySelectorAll(".pawn").forEach(pawn => {
        pawn.remove();
    });

    const square = document.querySelector(
        `.square[data-number="${group1Position}"]`
    );

    if (square) {

        const pawn = document.createElement("div");

        pawn.className = "pawn";
        pawn.textContent = "♟";

        square.appendChild(pawn);
    }
}


function movePawnUp() {

    if (group1Position < 49) {

        group1Position++;

        updatePawn();

        checkWinner(group1Position, "Pink");
    }
}


function movePawnDown() {

    // If Pink is currently at 49,
    // remove Pink from the finish list
    if (group1Position === 49) {

        removeFromFinish("Pink");
    }

    if (group1Position > 1) {

        group1Position--;

        updatePawn();
    }
}
let wheelRotation = 0;

function spinWheel() {

    const wheel = document.getElementById("wheel");
    const resultBox = document.getElementById("wheel-result");

    const results = [
        "BLOCK",
        "STEAL",
        "PROCEED"
    ];

    // Randomly choose a result
    const result = Math.floor(Math.random() * 3);

    const sectionAngle = 120;

    // Center of selected section
    const sectionCenter = result * sectionAngle + 60;

    // Current wheel angle
    const currentAngle =
        ((wheelRotation % 360) + 360) % 360;

    // Target angle
    const targetAngle =
        (360 - sectionCenter) % 360;

    // Exact movement needed
    const delta =
        (targetAngle - currentAngle + 360) % 360;

    // Add 5 full rotations
    wheelRotation += 5 * 360 + delta;

    wheel.style.transform =
        `rotate(${wheelRotation}deg)`;

    resultBox.textContent = results[result];
}
// ==================== GROUP 2 ====================

let group2Position = 1;

function updatePawn2() {

    document.querySelectorAll(".pawn2").forEach(pawn => {
        pawn.remove();
    });

    const square = document.querySelector(
        `.square[data-number="${group2Position}"]`
    );

    if (square) {

        const pawn = document.createElement("div");

        pawn.className = "pawn2";
        pawn.textContent = "♟";

        square.appendChild(pawn);
    }
}


function movePawn2Up() {

    if (group2Position < 49) {

        group2Position++;

        updatePawn2();

        checkWinner(group2Position, "Green");
    }
}


function movePawn2Down() {

    if (group2Position === 49) {

        removeFromFinish("Green");
    }

    if (group2Position > 1) {

        group2Position--;

        updatePawn2();
    }
}


// ==================== GROUP 3 ====================

let group3Position = 1;

function updatePawn3() {

    document.querySelectorAll(".pawn3").forEach(pawn => {
        pawn.remove();
    });

    const square = document.querySelector(
        `.square[data-number="${group3Position}"]`
    );

    if (square) {

        const pawn = document.createElement("div");

        pawn.className = "pawn3";
        pawn.textContent = "♟";

        square.appendChild(pawn);
    }
}


function movePawn3Up() {

    if (group3Position === 49) {

    }

    if (group3Position > 1) {

        group3Position--;

}

        `.square[data-number="${group4Position}"]`

        checkWinner(group4Position, "Orange");

    }

        group4Position--;

        updatePawn4();
    }

let voucherRotation = 0;

function openVoucher() {
    document.getElementById("voucherOverlay").style.display = "block";
}

function closeVoucher() {
    document.getElementById("voucherOverlay").style.display = "none";
}

function spinVoucher() {

    const wheel = document.getElementById("voucherWheel");

    const results = [
        "*2",
        "/2",
        "-2",
        "+2",
        "-3",
        "-1",
        "-5",
        "+5"
    ];

    const random = Math.floor(Math.random() * results.length);

    const sectionAngle = 45;

    // Center of the selected section
    const sectionCenter = random * sectionAngle + 22.5;

    const currentAngle =
        ((voucherRotation % 360) + 360) % 360;

    const targetAngle =
        (360 - sectionCenter) % 360;

    const delta =
        (targetAngle - currentAngle + 360) % 360;

    // Add 5 complete rotations
    voucherRotation += 5 * 360 + delta;

    wheel.style.transform =
        `rotate(${voucherRotation}deg)`;

    setTimeout(function() {
        document.getElementById("voucherResult").textContent =
            "Result: " + results[random];
    }, 5000);
}

function openChoose() {

    document.getElementById("chooseOverlay").style.display = "block";

    // Generate 4 different numbers from 1-10
    const numbers = [];

    while (numbers.length < 4) {

        const number =
            Math.floor(Math.random() * 4) + 1;

        if (!numbers.includes(number)) {
            numbers.push(number);
        }
    }

    const boxes =
        document.querySelectorAll(".choose-box");

    boxes.forEach(function(box, index) {

        box.textContent = "?";

        // Store the generated number
        box.dataset.number = numbers[index];

    });

    document.getElementById("chooseResult").textContent = "";
}


function closeChoose() {

    document.getElementById("chooseOverlay").style.display = "none";

}


function chooseNumber(box) {

    // Show the number inside the selected box
    box.textContent = box.dataset.number;

    document.getElementById("chooseResult").textContent =
        "You chose: " + box.dataset.number;

}
